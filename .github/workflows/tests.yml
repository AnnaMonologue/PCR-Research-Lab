name: PCR Research Lab — Synthetic Sandbox CI / 虚构沙盒测试

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  test:
    name: Node 22 tests / Node 22 自动检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out public source / 检出公开源码
        uses: actions/checkout@v4
      - name: Set up Node / 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax check / JS 语法检查
        run: |
          node --check demo/model.js
          node --check demo/app.js
          node --check cloudflare/src/worker.mjs
          node --check cloudflare/src/worker.test.mjs
          node --check cloudflare/public/sandbox.js
          node --check cloudflare/scripts/admin.mjs
      - name: Synthetic tests / 虚构用例测试
        run: npm test
      - name: Public artefacts guard / 公开文件安全检查
        run: |
          test ! -e .env
          test ! -e cloudflare/.dev.vars
          test ! -e cloudflare/wrangler.jsonc
          test ! -e runtime
          test ! -d participant-records
          test ! -d original-data
